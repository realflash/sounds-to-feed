[project]
name = "attono-blueprint-app"
version = "0.1.0"
description = "Gold Standard blueprint for Attono applications"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.34.0",
    "python-json-logger>=2.0.7",
    "feedgen>=1.0.0",
    "starlette>=1.0.1",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "bandit",
    "pip-audit",
    "httpx"
]

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
# B008: Do not perform function call in argument defaults (FastAPI Depends)
ignore = ["B008"]

[tool.bandit]
exclude_dirs = ["tests", "src/backend/tests"]
